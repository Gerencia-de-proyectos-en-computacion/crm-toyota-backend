spring:
  datasource:
    url: jdbc:h2:mem:crm_toyota_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

crm:
  ml:
    mode: http
    base-url: http://127.0.0.1:8000
    internal-api-key: crm-toyota-internal-ml-key-2026
