server:
  port: ${PORT:8080}

spring:
  application:
    name: crm-toyota-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/crm_toyota}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

crm:
  security:
    jwt-secret: ${JWT_SECRET:TricoreToyotaCrmSuperSecretKey2026PeruMostradorSeguridadLey29733Key!}
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:14}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app}
  ml:
    mode: ${ML_MODE:mock}
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    internal-api-key: ${ML_INTERNAL_API_KEY:crm-toyota-internal-ml-key-2026}
    timeout-seconds: ${ML_TIMEOUT_SECONDS:15}
