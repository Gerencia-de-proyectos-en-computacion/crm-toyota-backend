services:
  - type: web
    name: crm-toyota-backend
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "7860"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ML_MODE
        value: "http"
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_INTERNAL_API_KEY
        value: "crm-toyota-internal-ml-key-2026"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
